<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cybersecurity Awareness</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      font-family: Arial, sans-serif;
      font-size: 2em;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 1s ease;
    }

    #message {
      padding: 20px;
      text-align: center;
      line-height: 1.4em;
    }

    /* Whole screen flashes red/black, plus text flashes */
    body.spam {
      animation: bgflash 0.3s alternate 12;
    }

    #message.flash {
      animation: textflash 0.15s alternate 24;
    }

    @keyframes bgflash {
      from { background-color: #b30000; }
      to   { background-color: black; }
    }

    @keyframes textflash {
      from { color: white; }
      to   { color: yellow; }
    }

    /* Final green screen */
    body.final-screen {
      background-color: #00cc66 !important;
      color: black !important;
      font-size: 1.5em;
      padding: 40px;
      box-sizing: border-box;
    }

    .final-message {
      max-width: 90%;
      white-space: pre-wrap;
      color: black !important;
    }
  </style>
</head>
<body>
  <div id="message">Tap the screen to continue</div>

  <script>
    let tapCount = 0;
    const message = document.getElementById('message');

    function handleTap() {
      tapCount++;

      if (tapCount === 1) {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        document.body.classList.add("spam");
        message.textContent = "YOU ARE SPAMMED";
        message.classList.add("flash");
      }
      else if (tapCount === 2) {
        document.body.classList.remove("spam");
        message.classList.remove("flash");
        message.textContent = "DON'T CLICK EVERYTHING, IF YOU DON'T KNOW THE SOURCE";
        message.style.color = "#00ff99";
      }
      else if (tapCount === 3) {
        document.body.classList.add("final-screen");
        message.removeAttribute("style");
        message.className = "final-message";
        message.textContent = "✅ This was a cybersecurity awareness demo.\n\nBe careful with unknown links, files, and QR codes.\n\nAlways verify the source before you click!";
      }
    }

    // One listener only: avoids double-counting on phones
    document.body.addEventListener('click', handleTap);
  </script>
</body>
</html>
